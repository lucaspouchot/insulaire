[package]
name = "insulaire-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Hexagonal coordinate model, authored content definitions and content validation."
keywords.workspace = true
categories.workspace = true

[features]
# Exposes `insulaire_world::testing` fixtures to downstream test suites.
# Off by default so the fixtures never reach the WASM bundle.
testing = []

[lints.rust]
missing_docs = "warn"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The TypeScript mirror of these definitions is derived from them rather than
# retyped beside them (`docs/adr/ADR-0012-shared-content-validation.md`). The
# derive contributes `impl TS` blocks and the `#[test]` writers that
# `scripts/generate-content-types.mjs` drives; nothing calls them at runtime.
ts-rs = { workspace = true }
