# Builds the game's executable for every platform it ships to.
#
# Tauri cannot cross-compile: a Windows installer needs Windows, a .dmg needs
# macOS, and a .deb needs a glibc no newer than the oldest distribution we
# support. That is the whole reason this workflow exists — one machine cannot
# produce the delivery on its own (`docs/adr/ADR-0017-desktop-executable.md`).
#
# Linux builds on ubuntu-22.04 on purpose: a binary linked against a newer glibc
# refuses to start on an older system, so the oldest runner we support is the one
# that must build. That covers Ubuntu 22.04+, Debian 12+, and — through the
# AppImage — Arch and everything else.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            rust-target: ''
          - label: macos-aarch64
            os: macos-14
            rust-target: aarch64-apple-darwin
          - label: macos-x86_64
            os: macos-13
            rust-target: x86_64-apple-darwin
          - label: linux-x86_64
            os: ubuntu-22.04
            rust-target: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Add the build target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop -> target

      # WebKitGTK is the webview on Linux; the rest is what wraps it.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev patchelf

      - run: npm ci

      # The engine, as WASM: the executable embeds it, exactly as the browser
      # build does.
      - run: npm run wasm:build

      # Builds the editor-free web bundle first (beforeBuildCommand), then the
      # native shell around it.
      - name: Build the desktop application
        run: npm run desktop:build -- ${{ matrix.rust-target && format('--target {0}', matrix.rust-target) || '' }}

      # The executable embeds the web bundle; this proves the editor is not in it.
      - name: Verify the embedded client build
        run: node scripts/verify-client-build.mjs

      # macOS builds are unsigned for now: a downloaded .dmg raises Gatekeeper
      # until an Apple Developer ID and notarisation are added here.
      - uses: actions/upload-artifact@v4
        with:
          name: insulaire-${{ matrix.label }}
          if-no-files-found: error
          path: |
            apps/desktop/target/release/bundle/**/*
            apps/desktop/target/*/release/bundle/**/*
            apps/desktop/target/release/insulaire
            apps/desktop/target/release/insulaire.exe
            apps/desktop/target/*/release/insulaire
            apps/desktop/target/*/release/insulaire.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
