[workspace]
resolver = "2"
members = [
    "crates/world",
    "crates/simulation",
    "crates/engine",
    "crates/wasm",
]

[workspace.package]
version = "0.15.0"
edition = "2021"
rust-version = "1.82"
publish = false
description = "Deterministic turn-based simulation engine for an authored hexagonal world."
keywords = ["hex", "game-engine", "simulation", "wasm"]
categories = ["game-engines", "simulation"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

insulaire-world = { path = "crates/world", version = "0.15.0" }
insulaire-simulation = { path = "crates/simulation", version = "0.15.0" }
insulaire-engine = { path = "crates/engine", version = "0.15.0" }

# `wasm-pack` builds a size-optimised artefact; the workspace release profile is
# tuned for the WASM bundle rather than for native benchmarks.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
